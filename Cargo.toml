[package]
name = "docstream"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
bytes = { version = "1.11.1", features = ["serde"] }
futures = "0.3.32"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http2"] }
pdfium-render = { version = "0.9.2", features = ["thread_safe"] }
sentencex = "0.1.29"
serde = "1.0.228"
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.3", features = ["serde", "v4"] }
toml = "1.1.2"
qdrant-client = "1.18.0"
dotenvy = "0.15.7"
axum = { version = "0.7.9", features = ["json"] }
